name: Build

on:
  push:
    branches:
      - main
      - deploy
      - master


jobs:
  sonar:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Buildd
        run: mvn clean install

      - name: Sonar Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
